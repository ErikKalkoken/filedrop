[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "filedrop"
version = "0.1.0"
description = "Anonymous file drop with admin-managed upload folders"
authors = [{name = "Erik Kalkoken", email = "erik.kalkoken@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "markdown>=3.7,<4",
    "nh3>=0.2,<1",
]

[project.scripts]
filedrop-manage = "filedrop.manage:main"

[tool.isort]
profile = "black"
multi_line_output = 3
